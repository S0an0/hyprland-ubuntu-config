# Hyprpuccin-inspired configuration for Ubuntu 26.04 / Hyprland 0.56

source = ~/.config/hypr/theme.conf

monitor = eDP-1,2560x1600@120,0x0,1.333333
monitor = ,preferred,auto,1

$terminal = alacritty
$fileManager = nautilus --new-window
$browser = google-chrome-stable https://www.google.com
$menu = rofi -show drun -theme ~/.config/rofi/launcher.rasi
$mainMod = SUPER

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = ~/.local/bin/hypr-desktop-entry-cleanup
exec-once = ~/.local/bin/hypr-theme apply
exec-once = /usr/lib/x86_64-linux-gnu/libexec/polkit-kde-authentication-agent-1
exec-once = waybar
exec-once = ~/.local/bin/hypr-desktop-widgets
exec-once = ~/.local/bin/hypr-wallpaper-cycle
exec-once = nm-applet --indicator
exec-once = udiskie --tray
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11,*
env = ELECTRON_OZONE_PLATFORM_HINT,auto

general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = $activeBorder
    col.inactive_border = $inactiveBorder
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 14
    rounding_power = 2
    active_opacity = 0.85
    inactive_opacity = 0.40

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = $shadowColor
    }

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.20
    }
}

animations {
    enabled = true
    bezier = overshot,0.05,0.90,0.10,1.05
    bezier = smoothOut,0.36,0,0.66,-0.56
    bezier = smoothIn,0.25,1,0.50,1
    bezier = workspace,0.20,0.85,0.25,1

    animation = windows,1,5,overshot,popin 88%
    animation = windowsOut,1,4,smoothOut,popin 88%
    animation = border,1,7,smoothIn
    animation = borderangle,1,8,default
    animation = fade,1,5,smoothIn
    animation = workspaces,1,6,workspace,slide
    animation = specialWorkspace,1,5,overshot,slidevert
}

dwindle {
    preserve_split = true
    smart_split = false
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 1
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle
    repeat_delay = 300
    repeat_rate = 35
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
        disable_while_typing = true
    }
}

gesture = 3, horizontal, workspace

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Space, exec, $menu
bind = $mainMod, Tab, exec, rofi -show window -theme ~/.config/rofi/launcher.rasi
bind = $mainMod, code:27, exec, rofi -show run
bind = $mainMod, code:26, exec, $fileManager
bind = $mainMod, code:56, exec, $browser
bind = $mainMod, code:24, killactive,
bind = $mainMod SHIFT, code:24, exec, wlogout
bind = $mainMod, code:55, togglefloating,
bind = $mainMod, code:41, fullscreen,
bind = $mainMod, code:33, pseudo,
bind = $mainMod, code:28, exec, ~/.local/bin/hypr-theme-menu
bind = $mainMod, code:38, exec, alacritty -e cava
bind = $mainMod, code:46, exec, ~/.local/bin/hypr-lock-safe
bind = $mainMod, code:39, togglespecialworkspace, magic
bind = $mainMod SHIFT, code:39, movetoworkspace, special:magic
bind = $mainMod, code:53, exec, ~/.local/bin/hypr-clipboard
bind = $mainMod, code:25, exec, ~/.local/bin/hypr-wallpaper-next --notify
bind = , Print, exec, ~/.local/bin/hypr-screenshot region
bind = $mainMod, Print, exec, ~/.local/bin/hypr-screenshot full

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindl = ,XF86AudioNext, exec, playerctl next
bindl = ,XF86AudioPause, exec, playerctl play-pause
bindl = ,XF86AudioPlay, exec, playerctl play-pause
bindl = ,XF86AudioPrev, exec, playerctl previous

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

windowrule {
    name = float-utilities
    match:class = ^(org.pulseaudio.pavucontrol|nm-connection-editor|blueman-manager)$
    float = on
    center = on
    size = 900 650
}

windowrule {
    name = picture-in-picture
    match:title = ^(Picture-in-Picture)$
    float = on
    pin = on
    keep_aspect_ratio = on
}

layerrule {
    name = blur-waybar
    match:namespace = ^(waybar)$
    blur = on
    ignore_alpha = 0
}

layerrule {
    name = blur-rofi
    match:namespace = ^(rofi)$
    blur = on
    ignore_alpha = 0
}
